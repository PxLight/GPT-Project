<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkkf Player Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <div>
        <h1>Linkkf Player Tools</h1>
        <p id="status">설정을 불러오는 중…</p>
      </div>
      <label class="switch" aria-label="확장 기능 켜기 또는 끄기">
        <input id="enabled" type="checkbox" disabled>
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <p class="notice">설정을 변경하면 열려 있는 지원 영상 페이지가 자동으로 새로고침됩니다.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
